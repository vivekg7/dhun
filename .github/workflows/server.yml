# Runs the server half of `make check` on every push and pull request. A `server-vX.Y.Z` tag also
# publishes the server image to ghcr.io/vivekg7/dhun (amd64 for the NAS, arm64
# for everything else).
name: server

on:
  push:
    branches: [main]
    tags: ["server-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: make lint-server test-server

  image:
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vivekg7/dhun:${{ github.ref_name }}
            ghcr.io/vivekg7/dhun:latest

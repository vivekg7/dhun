# The Android half of `make check`, when the app changes. The runner image
# has the Android SDK; Gradle fetches the platform the app compiles against.
name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "Makefile", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "Makefile", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: make lint-android test-android
      # A release build runs R8, which catches what debug builds don't.
      - run: cd android && ./gradlew -q :app:assembleRelease

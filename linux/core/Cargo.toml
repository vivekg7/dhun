[package]
name = "dhun-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The system's SQLite, not a bundled copy.
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to the NAS: no TLS stack (plan 039). gzip for the first sync.
ureq = { version = "3", default-features = false, features = ["gzip"] }
# NFKD for search folding (plan 029); the standard library has none.
unicode-normalization = "0.1"

# The Flatpak (docs/plans/039_linux_app.md). `make linux` builds it with
# org.flatpak.Builder. Not for Flathub: the build fetches the crates
# Cargo.lock pins, rather than listing each one as a source.
id: io.github.vivekg7.dhun
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dhun
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --own-name=org.mpris.MediaPlayer2.dhun
  # The tray icon registers with the panel's watcher (StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Sync on waking from sleep: logind's PrepareForSleep.
  - --system-talk-name=org.freedesktop.login1
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  # Pitch apart from speed (plan 016) needs GStreamer's `pitch`, which the
  # GNOME runtime leaves out: libSoundTouch, and that one plugin from
  # gst-plugins-bad at the runtime's GStreamer version (plan 039, the spike).
  - name: soundtouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      # 2.3.3 asks for an older CMake than the SDK's.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DSOUNDSTRETCH=OFF
      - -DBUILD_SHARED_LIBS=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share
    sources:
      - type: archive
        url: https://codeberg.org/soundtouch/soundtouch/archive/2.3.3.tar.gz
        sha256: 06c00f37d28e5984944951c20d0845c7931e691c59820922230915d205131a47
  - name: gst-soundtouch
    buildsystem: simple
    build-commands:
      - meson setup _build --prefix=/app -Dauto_features=disabled -Dsoundtouch=enabled
      - ninja -C _build ext/soundtouch/libgstsoundtouch.so
      - install -Dm755 _build/ext/soundtouch/libgstsoundtouch.so /app/lib/gstreamer-1.0/libgstsoundtouch.so
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.6.tar.xz
        sha256: 6636f2c2289ceda52c4aba971338c81e2b5780d3381bd3673c1c116ec87587c3
  - name: dhun
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/dhun/cargo
    build-commands:
      - cargo build --release --locked -p dhun
      - install -Dm755 target/release/dhun /app/bin/dhun
      - install -Dm644 data/io.github.vivekg7.dhun.desktop /app/share/applications/io.github.vivekg7.dhun.desktop
      - install -Dm644 data/io.github.vivekg7.dhun.svg /app/share/icons/hicolor/scalable/apps/io.github.vivekg7.dhun.svg
      - install -Dm644 data/io.github.vivekg7.dhun.metainfo.xml /app/share/metainfo/io.github.vivekg7.dhun.metainfo.xml
    sources:
      - type: dir
        path: .
        skip:
          - target
          - build-dir
          - .flatpak-builder

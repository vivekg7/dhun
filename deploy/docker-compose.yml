# Dhun on a Synology NAS (Container Manager) or any Docker host.
# Edit the line marked MEDIA_PATH and the admin's name and password, then:
# docker compose up -d
# Why it looks like this: docs/plans/003_deployment.md

services:
  dhun:
    container_name: dhun
    image: ghcr.io/vivekg7/dhun:latest
    # A user that can read and write your Music folder. On Synology the first
    # user is usually 1026 and the "users" group is 100; check with `id <you>`.
    user: "1026:100"
    ports:
      - "8585:8585"
    volumes:
      - /volume1/homes/you/Media/Music:/media # MEDIA_PATH: your Music folder
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Kolkata
      # The admin, created on first start. Read only while there are no users,
      # so you can delete the password once Dhun is running. Everyone else is
      # added from the admin panel.
      - DHUN_ADMIN_USER=vivek
      - DHUN_ADMIN_PASSWORD=change-me-now
    restart: unless-stopped
